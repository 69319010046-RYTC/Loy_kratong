<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏮 ลอยกระทง 3D — Loy Krathong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Sarabun', sans-serif;
      touch-action: none;
    }

    /* ─── LOADING SCREEN ─────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 1000;
      background: radial-gradient(ellipse at 50% 60%, #1a0533 0%, #07090f 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1.2s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }

    .ld-ornament {
      font-size: 4rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #ff8800);
      margin-bottom: 10px;
    }
    .ld-title {
      font-size: 2.4rem; font-weight: 600;
      color: #ffaa44; letter-spacing: 4px;
      text-shadow: 0 0 25px #ff8800, 0 0 50px #ff4400;
      animation: glow-pulse 2.5s ease-in-out infinite alternate;
    }
    .ld-subtitle {
      color: rgba(255,245,204,0.65);
      font-size: 1rem; letter-spacing: 2px;
      margin: 6px 0 36px;
    }

    .ld-bar-wrap {
      width: 280px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px; overflow: hidden;
    }
    .ld-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #c8720a, #ffcc44);
      border-radius: 2px; transition: width 0.3s ease;
      box-shadow: 0 0 12px #ff8800;
    }
    .ld-hint {
      margin-top: 20px;
      color: rgba(255,245,204,0.4); font-size: 0.85rem;
      animation: blink 2s ease-in-out infinite;
    }

    /* decorative dots */
    .ld-dots { display: flex; gap: 8px; margin-bottom: 28px; }
    .ld-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ffaa44;
      animation: dot-blink 1.4s ease-in-out infinite;
    }
    .ld-dot:nth-child(2) { animation-delay: 0.2s; }
    .ld-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes glow-pulse {
      from { text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400; }
      to   { text-shadow: 0 0 35px #ffcc44, 0 0 70px #ff8800; }
    }
    @keyframes blink {
      0%,100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes dot-blink {
      0%,80%,100% { transform: scale(1); opacity: 0.4; }
      40% { transform: scale(1.4); opacity: 1; }
    }

    /* ─── MAIN CANVAS ───────────────────────────── */
    #canvas-wrap { position: fixed; inset: 0; }

    /* ─── INFO PANEL (top) ───────────────────────── */
    #info-bar {
      position: fixed; top: 18px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,245,204,0.6); font-size: 0.8rem;
      letter-spacing: 1px; z-index: 100;
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity 1s ease 1s;
    }
    #info-bar.show { opacity: 1; }

    /* ─── BOTTOM UI ──────────────────────────────── */
    #ui-wrap {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      z-index: 100;
      opacity: 0; transition: opacity 1s ease 1.2s;
    }
    #ui-wrap.show { opacity: 1; }

    #wish-input {
      width: 300px; padding: 11px 20px;
      background: rgba(5, 5, 20, 0.7);
      border: 1px solid rgba(255,170,68,0.45);
      border-radius: 30px;
      color: #fff5cc; font-size: 1rem;
      font-family: 'Sarabun', sans-serif;
      text-align: center; outline: none;
      backdrop-filter: blur(12px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    #wish-input::placeholder { color: rgba(255,245,204,0.35); }
    #wish-input:focus {
      border-color: rgba(255,170,68,0.9);
      box-shadow: 0 0 18px rgba(255,136,0,0.35);
    }

    #release-btn {
      padding: 12px 44px;
      background: linear-gradient(135deg, #b8720a 0%, #ffaa44 60%, #ff8800 100%);
      border: none; border-radius: 30px;
      color: #fff; font-size: 1.05rem;
      font-family: 'Sarabun', sans-serif; font-weight: 600;
      cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 4px 22px rgba(255,120,0,0.5);
      transition: transform 0.25s, box-shadow 0.25s, opacity 0.25s;
    }
    #release-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(255,136,0,0.75);
    }
    #release-btn:active:not(:disabled) { transform: scale(0.96); }
    #release-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #tour-btn {
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,170,68,0.55);
      border-radius: 30px;
      color: #ffe082; font-size: 0.95rem;
      font-family: 'Sarabun', sans-serif; font-weight: 600;
      cursor: pointer; letter-spacing: 1px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
    }
    #tour-btn:hover {
      background: rgba(255,170,68,0.25);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(255,150,0,0.4);

    /* ─── CONTROLS HINT ──────────────────────────── */
    #ctrl-hint {
      position: fixed; bottom: 28px; right: 20px;
      color: rgba(255,245,204,0.35);
      font-size: 0.72rem; line-height: 1.6;
      text-align: right; z-index: 100;
      pointer-events: none;
      opacity: 0; transition: opacity 1s ease 2s;
    }
    #ctrl-hint.show { opacity: 1; }

    /* ─── FLOATING WISH ──────────────────────────── */
    .wish-float {
      position: fixed; z-index: 90;
      pointer-events: none;

      font-size: 0.88rem;
      text-shadow: 0 0 10px #ff8800;
      animation: wish-rise 5s ease-out forwards;

      70%  { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-140px) scale(0.8); }

    /* ─── FIREWORK FLASH ─────────────────────────── */

      position: fixed; inset: 0; z-index: 200;
      pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at 50% 40%,

    /* ─── KRATHONG COUNTER ───────────────────────── */
    #counter {

      color: rgba(255,245,204,0.5); font-size: 0.78rem;
      opacity: 0; transition: opacity 0.5s;
    }

<!-- ═══════════════════════════════════════════════════
     MAIN SCENE
════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { Water }             from 'three/addons/objects/Water.js';
import { EffectComposer }    from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }        from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }   from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }        from 'three/addons/postprocessing/OutputPass.js';

/* ───────────────────────────────────────────────────
   DOM REFS
─────────────────────────────────────────────────── */
const wrap        = document.getElementById('canvas-wrap');
const ldBar       = document.getElementById('ld-bar');
const ldScreen    = document.getElementById('loading-screen');
const infoBar     = document.getElementById('info-bar');
const uiWrap      = document.getElementById('ui-wrap');
const ctrlHint    = document.getElementById('ctrl-hint');
const releaseBtn  = document.getElementById('release-btn');
const wishInput   = document.getElementById('wish-input');
const flashEl     = document.getElementById('flash');
const counterEl   = document.getElementById('counter');
const cntEl       = document.getElementById('cnt');

/* ───────────────────────────────────────────────────
   GLOBALS
─────────────────────────────────────────────────── */
let scene, camera, renderer, composer, controls, clock;
let water, waterFallback = false;
let starMat;
let lanternMesh;
let audioCtx, audioReady = false;
let krathongReleased = 0;

let heroKrathong = null;
let heroFlame = null;
let cruiseBoat = null;
const driftingKrathongs = [];
const activeKeys = {};

const lanternData   = [];
const floatingK     = [];   // user released krathongs
const candleLights  = [];   // per-krathong lights
const walkingNPCs   = [];   // animated festival-goers
const stallAnimators = [];  // market animations

/* ───────────────────────────────────────────────────
   ENTRY
─────────────────────────────────────────────────── */
async function init() {
  clock = new THREE.Clock();
  progress(5);

  // ── Renderer (Optimized for rock-solid 60 FPS!) ──
  renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: 'high-performance',
    precision: 'mediump'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  // Pixel ratio 1.0 eliminates Retina 4K/3K fill-rate stutter while maintaining crisp visuals
  renderer.setPixelRatio(1.0);
  renderer.shadowMap.enabled   = false; // Disable heavy shadow passes for silky smooth frame rate
  renderer.toneMapping         = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace    = THREE.SRGBColorSpace;
  wrap.appendChild(renderer.domElement);
  progress(10);

  // ── Scene ─────────────────────────────────────────
  scene = new THREE.Scene();

  // ── Camera (Water-level viewpoint matching reference photo!) ──
  camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0.0, 1.35, 4.8);

  // ── Controls ──────────────────────────────────────
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0.0, 0.75, -5.5);
  controls.maxPolarAngle  = Math.PI / 2 - 0.01;
  controls.minDistance    = 1.5;
  controls.maxDistance    = 95;
  controls.enableDamping  = true;
  controls.dampingFactor  = 0.08;
  controls.enablePan      = true;          // Enable smooth panning across the scene
  controls.screenSpacePanning = true;
  controls.panSpeed       = 1.3;
  controls.rotateSpeed    = 0.85;
  controls.autoRotate     = true;          // Auto-drift/auto-pan cinematic tour!
  controls.autoRotateSpeed = 0.55;         // Smooth graceful glide
  controls.update();
  progress(15);

  // ── Build world (Chao Phraya Loy Krathong Iconic Scene) ──
  buildLighting();              progress(20);
  buildSky();                   progress(28);
  buildStars();                 progress(35);
  buildMoon();                  progress(42);
  await buildWater();           progress(52);
  buildChaoPhrayaRiverside();   progress(64);
  buildHeroKrathong();          progress(74);
  buildRama8Bridge();           progress(82);
  buildThaiCruiseBoat();        progress(88);
  buildDriftingKrathongField(); progress(94);
  buildLanterns();              progress(96);
  buildPostFX();                progress(98);
  bindEvents();                 progress(100);

  // ── Reveal ────────────────────────────────────────
  setTimeout(() => {
    ldScreen.classList.add('fade-out');
    setTimeout(() => {
      ldScreen.style.display = 'none';
      infoBar.classList.add('show');
      uiWrap.classList.add('show');
      ctrlHint.classList.add('show');
      counterEl.classList.add('show');
    }, 1200);
  }, 400);

  loop();
}

/* ───────────────────────────────────────────────────
   PROGRESS
─────────────────────────────────────────────────── */
function progress(v) { ldBar.style.width = v + '%'; }

/* ═══════════════════════════════════════════════════
   LIGHTING  (Chao Phraya River Night Festival)
════════════════════════════════════════════════════ */
function buildLighting() {
  // Ambient fill — pleasant, clear night ambient
  scene.add(new THREE.AmbientLight(0x2a3852, 1.15));
  scene.add(new THREE.HemisphereLight(0x3d4e68, 0x162012, 0.8));

  // Moonlight — gentle silvery moon
  const moon = new THREE.DirectionalLight(0xfff6e4, 0.95);
  moon.position.set(-60, 95, -75);
  moon.castShadow = true;
  moon.shadow.radius = 2.0;
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.near   = 10;
  moon.shadow.camera.far    = 450;
  const s = 140;
  moon.shadow.camera.left   = -s;
  moon.shadow.camera.right  = s;
  moon.shadow.camera.top    = s;
  moon.shadow.camera.bottom = -s;
  moon.shadow.bias          = -0.0001;
  moon.shadow.normalBias    = 0.003;
  scene.add(moon);

  // Warm golden illumination for river pier & steps
  const pierLight = new THREE.PointLight(0xffa726, 2.2, 55, 1.4);
  pierLight.position.set(-6, 5, -10);
  scene.add(pierLight);
  candleLights.push(pierLight);

  // Rama 8 bridge soft floodlight
  const bridgeLight = new THREE.DirectionalLight(0xffb300, 0.7);
  bridgeLight.position.set(35, 30, -120);
  scene.add(bridgeLight);
}

/* ═══════════════════════════════════════════════════
   SKY  — custom gradient sphere
════════════════════════════════════════════════════ */
function buildSky() {
  const geo = new THREE.SphereGeometry(900, 32, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTop:     { value: new THREE.Color(0x000008) },
      uMid:     { value: new THREE.Color(0x060810) },
      uHorizon: { value: new THREE.Color(0x180530) },
    },
    vertexShader: /* glsl */`
      varying float vY;
      void main() {
        vY = normalize((modelMatrix * vec4(position,1.0)).xyz).y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uTop, uMid, uHorizon;
      varying float vY;
      void main() {
        float h = clamp(vY, -0.1, 1.0);
        vec3 col = mix(uHorizon, uMid,   smoothstep(-0.1, 0.25, h));
             col = mix(col,      uTop,   smoothstep(0.25, 1.0,  h));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}

/* ═══════════════════════════════════════════════════
   STARS — GPU particle twinkling
════════════════════════════════════════════════════ */
function buildStars() {
  const N = 7000;
  const pos  = new Float32Array(N * 3);
  const size = new Float32Array(N);
  const pha  = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const θ = Math.random() * Math.PI * 2;
    const φ = Math.acos(2 * Math.random() - 1);
    const r = 650 + Math.random() * 100;
    pos[i*3]   = r * Math.sin(φ) * Math.cos(θ);
    pos[i*3+1] = Math.abs(r * Math.cos(φ)) + 10;
    pos[i*3+2] = r * Math.sin(φ) * Math.sin(θ);
    size[i] = 0.6 + Math.random() * 2.4;
    pha[i]  = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,  3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(pha,  1));

  starMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPR:   { value: renderer.getPixelRatio() }
    },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute float aPhase;
      uniform   float uTime, uPR;
      varying   float vAlpha;
      void main() {
        float tw   = sin(uTime * 1.8 + aPhase) * 0.3 + 0.7;
        vAlpha     = tw;
        vec4 mv    = modelViewMatrix * vec4(position, 1.0);
        gl_Position    = projectionMatrix * mv;
        gl_PointSize   = aSize * uPR * tw * (180.0 / -mv.z);
      }`,
    fragmentShader: /* glsl */`
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = (1.0 - d * 2.0) * vAlpha;
        gl_FragColor = vec4(0.88, 0.94, 1.0, a);
      }`,
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending
  });

  scene.add(new THREE.Points(geo, starMat));
}

/* ═══════════════════════════════════════════════════
   MOON  (Grand Luminous Full Moon — พระจันทร์เต็มดวง)
════════════════════════════════════════════════════ */
function createProceduralMoonTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Base luminous ivory gradient
  const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 256);
  grad.addColorStop(0, '#fffbf0');
  grad.addColorStop(0.7, '#f8edd4');
  grad.addColorStop(1, '#ebd7b5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Lunar Maria (Dark seas / rabbit on the moon shapes)
  ctx.fillStyle = 'rgba(175, 155, 130, 0.28)';
  const maria = [
    [180, 160, 75], [260, 140, 60], [330, 190, 85],
    [210, 260, 95], [290, 290, 80], [170, 320, 60],
    [320, 350, 50], [250, 210, 70]
  ];
  maria.forEach(([mx, my, mr]) => {
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
  });

  // Soft fine crater details
  ctx.fillStyle = 'rgba(140, 120, 100, 0.18)';
  for (let i = 0; i < 45; i++) {
    const cx = Math.random() * size;
    const cy = Math.random() * size;
    const cr = 6 + Math.random() * 22;
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}

function buildMoon() {
  const moonTex = createProceduralMoonTexture();
  const moonGeo = new THREE.SphereGeometry(14, 36, 36);
  const moonMat = new THREE.MeshStandardMaterial({
    map: moonTex,
    color: 0xfffcf0,
    emissive: 0xffeed0,
    emissiveMap: moonTex,
    emissiveIntensity: 0.42,
    roughness: 0.85,
    metalness: 0
  });

  const moonMesh = new THREE.Mesh(moonGeo, moonMat);
  moonMesh.position.set(-85, 140, -310);
  scene.add(moonMesh);

  // Soft subtle aura
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(17, 24, 24),
    new THREE.MeshBasicMaterial({
      color: 0xffeed0, transparent: true, opacity: 0.05,
      depthWrite: false, side: THREE.BackSide
    })
  );
  moonMesh.add(halo);
}

/* ═══════════════════════════════════════════════════
   WATER  — Three.js Water addon (planar reflection)
════════════════════════════════════════════════════ */
function createProceduralWaterNormals() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(size, size);
  const data = imgData.data;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const idx = (y * size + x) * 4;
      const u = (x / size) * Math.PI * 12;
      const v = (y / size) * Math.PI * 12;
      const nx = Math.sin(u) * Math.cos(v * 0.8) * 0.45 + Math.sin(u * 2.2 + v * 1.5) * 0.2;
      const ny = Math.cos(u * 0.7) * Math.sin(v) * 0.45 + Math.cos(u * 1.8 - v * 2.3) * 0.2;
      data[idx]     = Math.floor((nx * 0.5 + 0.5) * 255);
      data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
      data[idx + 2] = 255;
      data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

async function buildWater() {
  // Underlying dark riverbed plane to give depth
  const riverbed = new THREE.Mesh(
    new THREE.PlaneGeometry(800, 800),
    new THREE.MeshStandardMaterial({ color: 0x010810, roughness: 1, metalness: 0 })
  );
  riverbed.rotation.x = -Math.PI / 2;
  riverbed.position.y = -3.5;
  scene.add(riverbed);

  const initWaterMesh = (normalsTex) => {
    water = new Water(new THREE.PlaneGeometry(800, 800), {
      textureWidth:  256, // 4x faster planar reflection pass!
      textureHeight: 256,
      waterNormals:  normalsTex,
      sunDirection:  new THREE.Vector3(-0.3, 0.8, -0.5).normalize(),
      sunColor:      0x2a3845,
      waterColor:    0x030c18,
      distortionScale: 2.2,
      fog: false
    });
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0.0;
    water.receiveShadow = false; // Prevents shadow acne on water
    scene.add(water);
  };

  return new Promise(resolve => {
    new THREE.TextureLoader().load(
      'https://threejs.org/examples/textures/waternormals.jpg',
      tex => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        initWaterMesh(tex);
        resolve();
      },
      undefined,
      () => {
        // Instant procedural fallback (works 100% offline and in file://)
        const procTex = createProceduralWaterNormals();
        initWaterMesh(procTex);
        resolve();
      }
    );
  });
}

/* ═══════════════════════════════════════════════════

function buildHeroKrathong() {
  const g = new THREE.Group();

  // 3. Folded Banana Leaf Petals (กลีบใบตองพับจีบวิจิตรศิลป์ 2 ชั้น)
  // Outer layer: 22 folded petals pointing outward
  const outerPetals = 22;
  for (let i = 0; i < outerPetals; i++) {
    const a = (i / outerPetals) * Math.PI * 2;
    const pg = new THREE.Group();
    pg.position.set(Math.cos(a) * 0.66, 0.14, Math.sin(a) * 0.66);
    pg.rotation.y = -a - Math.PI / 2;
    pg.rotation.x = 0.38; // Lean outward

    // Folded double-leaf triangular prism
    const pMesh1 = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42, 4), leafMatDark);
    pMesh1.scale.set(1.4, 1.0, 0.35);
    pMesh1.position.y = 0.18;
    pMesh1.castShadow = true;
    pg.add(pMesh1);

    // Tip accent
    const pMesh2 = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.24, 4), leafMatLight);
    pMesh2.scale.set(1.3, 1.0, 0.3);
    pMesh2.position.set(0, 0.22, 0.02);
    pg.add(pMesh2);

    g.add(pg);
  }

  // Inner layer: 18 folded petals standing more upright, staggered
  const innerPetals = 18;
  for (let i = 0; i < innerPetals; i++) {
    const a = (i / innerPetals) * Math.PI * 2 + 0.12;
    const pg = new THREE.Group();
    pg.position.set(Math.cos(a) * 0.54, 0.18, Math.sin(a) * 0.54);
    pg.rotation.y = -a - Math.PI / 2;
    pg.rotation.x = 0.20; // More upright

    const pMesh = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.36, 4), leafMatLight);

  // 4. Lush Floral Bed (พวงมาลัยดอกไม้สด: ดอกดาวเรืองสีเหลืองทอง ดอกกล้วยไม้สีม่วง ดอกบัวสีชมพู)

  const marigoldPositions = [
    [0.34, 0.25, 0.0], [-0.34, 0.25, 0.0],
    [0.0, 0.25, 0.34], [0.0, 0.25, -0.34],
    [0.24, 0.25, 0.24], [-0.24, 0.25, 0.24],
    [0.24, 0.25, -0.24], [-0.24, 0.25, -0.24],
    [0.42, 0.24, 0.18], [-0.42, 0.24, 0.18],
    [0.18, 0.24, 0.42], [-0.18, 0.24, 0.42]

  marigoldPositions.forEach(([mx, my, mz], idx) => {

    mg.position.set(mx, my, mz);
    const mMat = (idx % 2 === 0) ? marigoldYellow : marigoldOrange;

    // Ruffled dense bloom
    for (let p = 0; p < 8; p++) {
      const pa = (p / 8) * Math.PI * 2;

    [0.32, 0.27, -0.15, 1.1], [-0.32, 0.27, -0.15, -1.1]
  ];

  orchidPositions.forEach(([ox, oy, oz, rot]) => {
    const og = new THREE.Group();
    og.position.set(ox, oy, oz);
    og.rotation.y = rot;
    og.rotation.x = -0.25;

    // 5 orchid petals
    for (let p = 0; p < 5; p++) {

  // Lotus Petals (กลีบดอกบัวสีชมพูประดับแทรก)

  // 5. Ritual Candle (เทียนสีเหลืองแท่งสง่างามตรงกลาง)

  // Wick

  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.26, 8), flameMat);
  flame.position.set(0, 1.03, 0);

  // Inner super-bright core

  g.add(flameCore);

  // Dedicated Master Candle PointLight
  const heroLight = new THREE.PointLight(0xffa726, 3.8, 12, 1.4);
  heroLight.position.set(0, 1.15, 0);
  g.add(heroLight);
  candleLights.push(heroLight);

  // 6. Incense Sticks (ธูป 3 ดอก พร้อมจุดไฟปลายแดง)

  g.scale.setScalar(1.25);

function buildRiversideFairyLights(zPoints) {
  const bulbColors = [0xffd54f, 0xff7043, 0x4dd0e1, 0x81c784, 0xff4081, 0xffeb3b];
  for (let i = 0; i < zPoints.length - 1; i++) {
    const z1 = zPoints[i];
    const z2 = zPoints[i + 1];
    const bulbs = 8;
    for (let b = 0; b < bulbs; b++) {
      const f = b / (bulbs - 1);
      const bz = z1 + (z2 - z1) * f;
      const sag = Math.sin(f * Math.PI) * 0.75;
      const by = 1.4 + 4.6 - sag;

      const col = bulbColors[(i * bulbs + b) % bulbColors.length];
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 8, 8),
        new THREE.MeshStandardMaterial({
          color: col, emissive: col, emissiveIntensity: 3.2, transparent: true, opacity: 0.95
        })
      );
      bulb.position.set(-6.8, by, bz);
      scene.add(bulb);
    }
  }
}

/* ═══════════════════════════════════════════════════
   RAMA VIII BRIDGE  (สะพานพระราม 8 สีทองอร่าม)
   Matches the golden cable-stayed bridge in the reference photo!
════════════════════════════════════════════════════ */
function buildRama8Bridge() {
  const bridgeGroup = new THREE.Group();
  bridgeGroup.position.set(28, 0, -125);

  const goldPylonMat = new THREE.MeshStandardMaterial({
    color: 0xffc107,
    emissive: 0xd49200,
    emissiveIntensity: 0.35,
    metalness: 0.85,
    roughness: 0.22
  });
  const goldCableMat = new THREE.MeshStandardMaterial({
    color: 0xffea00,
    emissive: 0xffa000,
    emissiveIntensity: 0.45,
    metalness: 0.9,
    roughness: 0.15
  });
  const deckMat = new THREE.MeshStandardMaterial({
    color: 0x212529,
    roughness: 0.85,
    metalness: 0.2
  });
  const lightBeadMat = new THREE.MeshStandardMaterial({
    color: 0xffea00,
    emissive: 0xffa000,
    emissiveIntensity: 0.75,
    transparent: true,
    opacity: 0.95
  });

  const foundation = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 16), deckMat);
  foundation.position.set(0, 1.2, 0);
  bridgeGroup.add(foundation);

  const legL = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.4, 38, 8), goldPylonMat);
  legL.position.set(-4.2, 18, 0);
  legL.rotation.z = -0.21;
  bridgeGroup.add(legL);

  const legR = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.4, 38, 8), goldPylonMat);
  legR.position.set(4.2, 18, 0);
  legR.rotation.z = 0.21;
  bridgeGroup.add(legR);

  const spireH = 36;
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 2.2, spireH, 8), goldPylonMat);
  spire.position.set(0, 34 + spireH * 0.5, 0);
  bridgeGroup.add(spire);

  const crown = new THREE.Mesh(new THREE.ConeGeometry(1.2, 5, 8), goldPylonMat);
  crown.position.set(0, 34 + spireH + 2.5, 0);
  bridgeGroup.add(crown);

  const beacon = new THREE.Mesh(
    new THREE.SphereGeometry(0.65, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  beacon.position.set(0, 34 + spireH + 5.2, 0);
  bridgeGroup.add(beacon);

  const cableCount = 20;
  for (let i = 0; i < cableCount; i++) {
    const f = i / (cableCount - 1);
    const towerY = 38 + f * 26;
    const deckZ  = -55 + f * 110;

    const dy = 9.5 - towerY;
    const dz = deckZ;
    const len = Math.sqrt(dy * dy + dz * dz);

    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, len, 5), goldCableMat);
    cable.position.set(0, (towerY + 9.5) * 0.5, deckZ * 0.5);

    const angleX = Math.atan2(dz, -dy);
    cable.rotation.x = angleX;
    bridgeGroup.add(cable);
  }

  const deckWidth  = 14;
  const deckLength = 280;
  const deck = new THREE.Mesh(new THREE.BoxGeometry(deckLength, 2.2, deckWidth), deckMat);
  deck.position.set(-60, 9.0, 0);
  bridgeGroup.add(deck);

  for (let b = 0; b < 28; b++) {
    const bz = -deckLength * 0.45 + b * (deckLength * 0.9 / 27);
    const bead = new THREE.Mesh(new THREE.SphereGeometry(0.24, 6, 6), lightBeadMat);
    bead.position.set(bz - 60, 10.6, -deckWidth * 0.48);
    bridgeGroup.add(bead);
  }

  const bridgeGlow = new THREE.PointLight(0xffb300, 3.2, 95, 1.4);
  bridgeGlow.position.set(-15, 6, 0);
  bridgeGroup.add(bridgeGlow);
  candleLights.push(bridgeGlow);

  scene.add(bridgeGroup);
}

/* ═══════════════════════════════════════════════════
   KRATHONG builder  — reusable
════════════════════════════════════════════════════ */
function makeKrathong(pos) {
  const g = new THREE.Group();

  const leafM   = new THREE.MeshStandardMaterial({ color: 0x2a6618, roughness: 0.75, metalness: 0, side: THREE.DoubleSide });
  const leafDkM = new THREE.MeshStandardMaterial({ color: 0x1a4a0c, roughness: 0.75, metalness: 0 });
  const goldM   = new THREE.MeshStandardMaterial({ color: 0xd4a017, emissive: 0x8b6000, emissiveIntensity: 0.5, metalness: 0.75, roughness: 0.25 });
  const flMat1  = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xcc2200, emissiveIntensity: 0.6, roughness: 0.5 });
  const flMat2  = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xcc8800, emissiveIntensity: 0.5, roughness: 0.5 });
  const flMat3  = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0xcc0044, emissiveIntensity: 0.4, roughness: 0.5 });
  const candleM = new THREE.MeshStandardMaterial({ color: 0xfff8e1, roughness: 0.9 });
  const flameM  = new THREE.MeshStandardMaterial({ color: 0xffbb00, emissive: 0xff5500, emissiveIntensity: 6, transparent: true, opacity: 0.9 });
  const stickM  = new THREE.MeshStandardMaterial({ color: 0x1a0f00, roughness: 1 });

  // Base disc
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.2, 0.35, 16), leafM);
  base.castShadow = true; g.add(base);

  // Folded leaf points around rim (12 petals)
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const petal = new THREE.Mesh(new THREE.ConeGeometry(0.44, 0.85, 5), (i%2===0) ? leafM : leafDkM);
    petal.position.set(Math.cos(a)*1.15, 0.38, Math.sin(a)*1.15);
    petal.rotation.set(Math.PI*0.22, a, 0);
    petal.castShadow = true;
    g.add(petal);
  }

  // Gold border ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.07, 6, 24), goldM);
  ring.rotation.x = Math.PI/2; ring.position.y = 0.22;
  g.add(ring);

  // Flowers cluster (marigold + lotus style)
  const flDefs = [
    [0.65, 0.5, 0,    flMat1], [-0.65, 0.5, 0,   flMat2],
    [0,    0.5, 0.65, flMat3], [0,     0.5,-0.65, flMat1],
    [0.46, 0.5, 0.46, flMat2], [-0.46, 0.5, 0.46,flMat3]
  ];
  flDefs.forEach(([fx, fy, fz, fm]) => {
    for (let p = 0; p < 7; p++) {
      const pa = (p/7)*Math.PI*2;
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.11, 6, 6), fm);
      petal.scale.set(1, 0.45, 1.8);
      petal.position.set(fx+Math.cos(pa)*0.13, fy, fz+Math.sin(pa)*0.13);
      petal.rotation.y = pa;
      g.add(petal);
    }
    // Center
    const ctr = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0xffee00, emissive: 0xffaa00, emissiveIntensity: 0.7 }));
    ctr.position.set(fx, fy+0.06, fz);
    g.add(ctr);
  });

  // Incense sticks (3)
  for (let i = 0; i < 3; i++) {
    const a = (i/3)*Math.PI*2 + 0.4;
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.1, 5), stickM);
    stick.position.set(Math.cos(a)*0.3, 0.9, Math.sin(a)*0.3);
    g.add(stick);
    // Ember tip glow
    const ember = new THREE.Mesh(new THREE.SphereGeometry(0.04, 4, 4),
      new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff2200, emissiveIntensity: 3 }));
    ember.position.set(Math.cos(a)*0.3, 1.46, Math.sin(a)*0.3);
    g.add(ember);
  }

  // Candle
  const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.85, 8), candleM);
  candle.position.set(0, 0.72, 0);
  g.add(candle);

  // Flame
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 7), flameM);
  flame.position.set(0, 1.3, 0);
  g.add(flame);

  // Per-krathong point light
  const kl = new THREE.PointLight(0xffaa44, 2.5, 14, 2);
  kl.position.set(0, 1.5, 0);
  g.add(kl);
  candleLights.push(kl);

  g.position.copy(pos);
  g.scale.setScalar(1.15);
  scene.add(g);
  return { group: g, flame, kl };
}

function buildLanterns() {

  const geo = new THREE.CylinderGeometry(0.55, 0.55, 1.3, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 2.8,

  });

  lanternMesh = new THREE.InstancedMesh(geo, mat, N);

function buildPostFX() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2)), // Half-res bloom runs 4x faster!
    0.38,   // strength: soft subtle glow
    0.32,   // radius
    0.78    // threshold
  ));
  composer.addPass(new OutputPass());
}

/* ═══════════════════════════════════════════════════
   EVENTS
════════════════════════════════════════════════════ */
function bindEvents() {
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  // Unlock audio on first interaction
  document.addEventListener('pointerdown', unlockAudio, { once: true });

  releaseBtn.addEventListener('click', onRelease);
  wishInput.addEventListener('keydown', e => { if (e.key === 'Enter') onRelease(); });

  // Auto-tour button toggle
  const tourBtn = document.getElementById('tour-btn');
  if (tourBtn) {
    tourBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      tourBtn.textContent = controls.autoRotate ? '🎥 เลื่อนชมวิว: เปิด' : '⏸️ เลื่อนชมวิว: ปิด';
      tourBtn.style.color = controls.autoRotate ? '#ffe082' : '#aaaaaa';
      tourBtn.style.borderColor = controls.autoRotate ? 'rgba(255,170,68,0.6)' : 'rgba(255,255,255,0.25)';
    });
  }

  // Keyboard navigation for panning (W/A/S/D and Arrow Keys)
  window.addEventListener('keydown', e => {
    if (document.activeElement === wishInput) return;
    activeKeys[e.code] = true;
  });
  window.addEventListener('keyup', e => {
    activeKeys[e.code] = false;
  });
}

/* ───────────────────────────────────────────────────
   FIREWORK PARTICLES
─────────────────────────────────────────────────── */
function spawnFirework() {
  const N   = 100;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);

  const cx = (Math.random() - 0.5) * 80;
  const cy = 55 + Math.random() * 50;
  const cz = -40 + (Math.random() - 0.5) * 50;
  const palettes = [
    [1, .55, 0], [1, .2, .2], [1, 1, 0], [0.9, 0.3, 1], [0.2, 0.9, 1], [1, 0.4, 0.8]
  ];
  const c = palettes[Math.floor(Math.random() * palettes.length)];

  for (let i = 0; i < N; i++) {
    const θ = Math.random() * Math.PI * 2;
    const φ = Math.acos(2 * Math.random() - 1);
    const r = Math.random() * 18;
    pos[i*3]   = cx + r * Math.sin(φ) * Math.cos(θ);
    pos[i*3+1] = cy + r * Math.cos(φ) * (0.6 + Math.random() * 0.4);
    pos[i*3+2] = cz + r * Math.sin(φ) * Math.sin(θ);
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.9, vertexColors: true,
    transparent: true, opacity: 1,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  // Flash
  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 120);

  // Fade out sparks
  let alpha = 1;
  const tid = setInterval(() => {
    alpha -= 0.04;
    mat.opacity = Math.max(0, alpha);
    if (alpha <= 0) {
      clearInterval(tid);
      scene.remove(pts);
      geo.dispose(); mat.dispose();
    }
  }, 60);

  // Flash light
  const fl = new THREE.PointLight(new THREE.Color(...c), 15, 90, 2);
  fl.position.set(cx, cy, cz);
  scene.add(fl);
  setTimeout(() => { scene.remove(fl); }, 800);
}

/* ═══════════════════════════════════════════════════
   AUDIO  — Web Audio API (procedural)
════════════════════════════════════════════════════ */
function unlockAudio() {
  if (audioReady) return;
  audioReady = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  startWaterLoop();
  scheduleRandomFireworks();
}

function startWaterLoop() {
  if (!audioCtx) return;
  const sr  = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr * 4, sr);
  const d   = buf.getChannelData(0);
  // Pink noise
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759;
    b2 = 0.96900*b2 + w*0.1538520; b3 = 0.86650*b3 + w*0.3104856;
    b4 = 0.55000*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.0168980;
    d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
    b6 = w * 0.115926;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp  = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.5;
  const gain = audioCtx.createGain(); gain.gain.value = 0.07;
  src.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

function playSplash() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  const f   = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(500, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.45);
  g.gain.setValueAtTime(0.35, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
  osc.connect(f); f.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function playFirework() {
  if (!audioCtx) return;
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr * 0.6, sr);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
  }
  const src  = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.65, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

function scheduleRandomFireworks() {
  const fire = () => {
    if (!audioReady) return;
    spawnFirework(); playFirework();
    setTimeout(fire, 12000 + Math.random() * 20000);
  };
  setTimeout(fire, 8000 + Math.random() * 10000);
}

/* ═══════════════════════════════════════════════════
   ANIMATION LOOP
════════════════════════════════════════════════════ */
function loop() {
  requestAnimationFrame(loop);
  const dt  = clock.getDelta();
  const t   = clock.getElapsedTime();

  // Smooth keyboard panning (W/A/S/D or Arrow keys)
  const panSpeed = 16.0 * dt;
  if (activeKeys['KeyW'] || activeKeys['ArrowUp']) {
    camera.position.z -= panSpeed;
    controls.target.z -= panSpeed;
  }
  if (activeKeys['KeyS'] || activeKeys['ArrowDown']) {
    camera.position.z += panSpeed;
    controls.target.z += panSpeed;
  }
  if (activeKeys['KeyA'] || activeKeys['ArrowLeft']) {
    camera.position.x -= panSpeed;
    controls.target.x -= panSpeed;
  }
  if (activeKeys['KeyD'] || activeKeys['ArrowRight']) {
    camera.position.x += panSpeed;
    controls.target.x += panSpeed;
  }

  // Water current flow speed
  if (!waterFallback && water?.material?.uniforms?.['time']) {
    water.material.uniforms['time'].value += dt * 0.72;
  }

  // Stars
  if (starMat) starMat.uniforms.uTime.value = t;

  // Lightweight flicker every 2nd frame
  if (Math.floor(t * 30) % 2 === 0) {
    candleLights.forEach((cl, i) => {
      cl.intensity = 2.0 + Math.sin(t * 10 + i * 1.7) * 0.35;
    });
  }

  // Animate sky lanterns
  const dummy = new THREE.Object3D();
  lanternData.forEach((d, i) => {
    d.y += d.speed;
    d.x += Math.sin(t * 0.4 + d.phase) * 0.018;
    if (d.y > 220) {
      d.y = 3 + Math.random() * 8;
      d.x = (Math.random() - 0.5) * 100;
      d.z = (Math.random() - 0.5) * 80 - 15;
    }
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.setScalar(d.scale);
    dummy.rotation.y = t * 0.25 + d.phase;
    dummy.updateMatrix();
    lanternMesh.setMatrixAt(i, dummy.matrix);
  });
  lanternMesh.instanceMatrix.needsUpdate = true;

  // ── Animate Walking NPCs (Procedural Walk Cycle) ──
  walkingNPCs.forEach(npc => {
    // 1. Move position along promenade path
    npc.root.position.z += npc.dir * npc.speed * dt;

    // Check path limits and reverse smoothly
    if (npc.dir > 0 && npc.root.position.z >= npc.maxZ) {
      npc.dir = -1;
      npc.root.rotation.y = Math.PI; // Turn around to face other direction
    } else if (npc.dir < 0 && npc.root.position.z <= npc.minZ) {
      npc.dir = 1;
      npc.root.rotation.y = 0;       // Face forward
    }

    // 2. Procedural Walk Cycle Math
    const cycleTime = t * npc.strideRate + npc.phaseOffset;

    // Pelvis vertical step bounce (bounces twice per stride) & subtle hip sway
    npc.hips.position.y = (0.95 + Math.abs(Math.sin(cycleTime * 2)) * 0.05) * npc.scale;
    npc.hips.rotation.z = Math.cos(cycleTime) * 0.04;
    npc.hips.rotation.y = Math.sin(cycleTime) * 0.03;

    // Legs swing forward and backward in anti-phase
    const legAngle = Math.sin(cycleTime) * 0.58;
    npc.leftLeg.rotation.x = legAngle;
    npc.rightLeg.rotation.x = -legAngle;

    // Knee bends during the upward/backward swing to lift foot naturally
    npc.leftCalf.rotation.x = Math.max(0, -Math.sin(cycleTime)) * 0.75;
    npc.rightCalf.rotation.x = Math.max(0, Math.sin(cycleTime)) * 0.75;

    // Arms swing in opposition to legs for natural human counter-balance
    npc.leftArm.rotation.x = -legAngle * 0.65;
    npc.rightArm.rotation.x = legAngle * 0.65;

    // Head subtle bob
    npc.head.rotation.x = Math.sin(cycleTime * 2) * 0.03;
  });

  // ── Animate Stall Vendors ──
  stallAnimators.forEach(sa => {
    if (sa.type === 'fanning') {
      sa.mesh.rotation.y = -Math.PI / 2 + Math.sin(t * 3.5) * 0.08;
    } else if (sa.type === 'stirring') {
      sa.mesh.rotation.y = -Math.PI / 2 + Math.sin(t * 2.8) * 0.06;
    }
  });

  // ── Animate Hero Master Krathong (Bobbing & Flame Dance) ──
  if (heroKrathong) {
    heroKrathong.position.y = 0.08 + Math.sin(t * 1.7) * 0.018;
    heroKrathong.rotation.z = Math.sin(t * 0.9) * 0.022;
    heroKrathong.rotation.x = Math.sin(t * 1.2) * 0.015;
  }
  if (heroFlame) {
    const f = 1 + Math.sin(t * 15) * 0.14;
    heroFlame.scale.set(f * 0.92, 1 + Math.sin(t * 12) * 0.18, f * 0.92);
  }

  // ── Animate Thai River Cruise Boat (Cruising smoothly downstream) ──
  if (cruiseBoat) {
    cruiseBoat.position.z -= 1.8 * dt; // Gliding down the Chao Phraya river
    if (cruiseBoat.position.z < -105) {
      cruiseBoat.position.z = 25; // Loop back from upstream
    }
    cruiseBoat.position.y = 0.12 + Math.sin(t * 0.8) * 0.035;
    cruiseBoat.rotation.z = Math.sin(t * 0.6) * 0.012;
    cruiseBoat.rotation.x = Math.sin(t * 0.7) * 0.010;
  }

  // ── Animate Drifting Krathongs Field ──
  driftingKrathongs.forEach(dk => {
    dk.mesh.position.z -= dk.speed * dt;
    dk.mesh.position.x += Math.sin(t * 0.6 + dk.phase) * 0.006;
    dk.mesh.position.y = 0.08 + Math.sin(t * 1.6 + dk.phase) * 0.016;
    dk.mesh.rotation.y += 0.003;
    if (dk.flame) {
      const f = 1 + Math.sin(t * 13 + dk.phase) * 0.15;
      dk.flame.scale.set(f, 1 + Math.sin(t * 10 + dk.phase) * 0.2, f);
    }
    if (dk.mesh.position.z < -120) {
      dk.mesh.position.z = 2.0 + Math.random() * 8.0;
      dk.mesh.position.x = -2.5 + Math.random() * 18.0;
    }
  });

  // Animate user released floating krathongs
  for (let i = floatingK.length - 1; i >= 0; i--) {
    const k = floatingK[i];
    k.group.position.x += k.vel.x;
    k.group.position.z += k.vel.z;
    k.phase += dt * 1.8;
    k.group.position.y = 0.12 + Math.sin(k.phase) * 0.04;
    k.group.rotation.y += 0.004;
    k.group.rotation.z = Math.sin(k.phase * 0.65) * 0.055;
    k.group.rotation.x = Math.sin(k.phase * 0.45) * 0.03;
    // Flame dance
    if (k.flame) {
      const f = 1 + Math.sin(t * 14 + i) * 0.12;
      k.flame.scale.set(f * 0.9, 1 + Math.sin(t * 11 + i) * 0.18, f * 0.9);
    }
    // Remove far krathongs
    const p = k.group.position;
    if (p.z < -300 || Math.abs(p.x) > 300) {
      scene.remove(k.group);
      candleLights.splice(candleLights.indexOf(k.kl), 1);
      floatingK.splice(i, 1);
    }
  }

  controls.update();
  composer.render();
}

/* ═══════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════════ */
init().catch(err => {
  console.error('[LoyKrathong]', err);
  document.querySelector('.ld-hint').textContent = 'เกิดข้อผิดพลาด: ' + err.message;
});
</script>
